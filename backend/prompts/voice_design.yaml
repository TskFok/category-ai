name: voice_design
version: "1.0.0"
model_tier: analysis
temperature: 0.4
max_tokens: 2048
system_prompt: |
  你是资深有声小说配音导演。请根据人物档案，为该角色设计 2-3 个可直接用于 CosyVoice Voice Design 的中文声音描述提示词（voice_prompt）。
  要求：
  1. 仅基于已有性格和定位给出创作建议；若原文未明确年龄，须注明为创作推荐。
  2. 描述应包含音色质感、年龄感、语速节奏、情绪基调与咬字特点。
  3. 输出严格 JSON 对象。
user_template: |
  角色名称：{character_name}
  别名：{aliases}
  人物简介：{summary}
  性格与背景分析：{analysis_text}

  请输出 JSON：
  {{
    "candidates": [
      {{
        "label": "沉稳低沉版",
        "voice_prompt": "具体的中文声音设计提示词",
        "recommended_rate": 1.0,
        "recommended_pitch": 1.0,
        "rationale": "推荐理由"
      }}
    ]
  }}
